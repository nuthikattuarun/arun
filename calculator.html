<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #clear
        {
            width: 270px;
            border: 3px solid grey;
            border-radius: 3px;
            padding: 20px;
            background-color: purple;
        }
        input
        {
            width: 20px;
            background-color: pink;
            color:black;
            border: 3px solid grey;
            border-radius: 5px;
            padding: 26px;
            margin: 5px;
            font-family: brush system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;

        }
        #calc
        {
            width:280px;
            border: 5px solid white;
            border-radius: 5px;
            padding: 20px;
            margin: auto;

        }
         body
         {
            background-color: yellow;

         }
    </style>
</head>
<body>
    <div>
    <form name="form1">
        <input id="calc" type="text" name="answers">
        <br><br>
        <input type="button" value="1" onclick="form1.answer.value+='1'">
        <input type="button" value="2" onclick="form1.answer.value+='2'">
         <input type="button" value="3" onclick="form1.answer.value+='3'">
        
        <input type="button" value="+" onclick="form1.answer.value+='+'">
        <br><br>
         <input type="button" value="4" onclick="form1.answer.value+='4'">
          <input type="button" value="5" onclick="form1.answer.value+='5'">
           <input type="button" value="6" onclick="form1.answer.value+='6'">
            <input type="button" value="-" onclick="form1.answer.value+='-'">
            <br><br>
             <input type="button" value="7" onclick="form1.answer.value+='7'">
              <input type="button" value="8" onclick="form1.answer.value+='8'">
               <input type="button" value="9" onclick="form1.answer.value+='9'">
                <input type="button" value="*" onclick="form1.answer.value+='*'">
                <br><br>
                 <input type="button" value="/" onclick="form1.answer.value+='/'">
                  <input type="button" value="0" onclick="form1.answer.value+='0'">
                   <input type="button" value="." onclick="form1.answer.value+='.'">
                   <input type="button" value="=" onclick="form1.answer.value = eval(form1.answer.value)">
                   <br><br>
                   <input type="button" value="clearall" click="form1.answer.value = ''" id="clear">
                   <br><br>
                   
                             

    </form>
    </div>
    
</body>
